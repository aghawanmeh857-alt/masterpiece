<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة موديلات أفق</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.7 Tahoma,system-ui;color:#eaf0fa;background:#101b2c}header{position:absolute;inset:18px 20px auto;display:flex;justify-content:space-between;gap:15px;align-items:center;z-index:2;background:#15283de8;border:1px solid #ffffff20;padding:12px 18px;border-radius:14px}a{color:#ffc39c;text-decoration:none}select{font:inherit;padding:9px;border:1px solid #ffffff30;border-radius:9px;background:#182c43;color:#fff}canvas{display:block}#status{position:absolute;bottom:24px;inset-inline-start:24px;background:#15283de8;padding:10px 16px;border-radius:10px;max-width:calc(100% - 48px)}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body>
<header><a href="../hero/userHero.html">أفق / معاينة الإضافات ←</a><label>الموديل <select id="asset"><option value="car">السيارة المختارة</option><option value="city">Modern City Block</option><option value="person">الشخصية الجديدة</option><option value="airplane">الطائرة</option></select></label></header><div id="status" role="status">جارٍ تحميل الموديل…</div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#c7d3dc');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,20000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff,0x7890a2,2));const sun=new THREE.DirectionalLight(0xfff3df,3);sun.position.set(50,100,60);scene.add(sun);let current;
const selected=new URLSearchParams(location.search).get('asset')||'car';document.getElementById('asset').value=selected;
async function show(){document.documentElement.dataset.previewReady='false';document.getElementById('status').textContent='جارٍ تحميل الموديل…';if(current)scene.remove(current);const type=document.getElementById('asset').value;const asset=await new GLTFLoader().loadAsync(({city:'modern-city-block.glb',car:'generic-sedan-car.glb',person:'business-male-4.glb',airplane:'airplane.glb'})[type]);asset.scene.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(asset.scene),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const parts=[];asset.scene.traverse(node=>{if(node.children.some(child=>child.isMesh)){const b=new THREE.Box3().setFromObject(node);parts.push({name:node.name,min:b.min.toArray(),max:b.max.toArray()});}});window.assetPreviewInfo={min:box.min.toArray(),max:box.max.toArray(),size:size.toArray(),parts};current=asset.scene;current.position.sub(center);current.position.y+=size.y/2;scene.add(current);const extent=Math.max(size.x,size.z,size.y*1.6);controls.target.set(0,size.y*.4,0);camera.position.set(extent*.9,extent*.65,extent*1.25);camera.near=extent/1000;camera.far=extent*30;camera.updateProjectionMatrix();controls.update();document.getElementById('status').textContent='اسحب للدوران · قرّب بالسكرول · الموديل الأصلي من Sketchfab';document.documentElement.dataset.previewReady='true';}
document.getElementById('asset').addEventListener('change',()=>show().catch(e=>document.getElementById('status').textContent=e.message));show().catch(e=>document.getElementById('status').textContent=e.message);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
